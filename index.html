<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipboard AI</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: radial-gradient(circle at top, #3b1d70, #111827 45%, #050816);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      max-width: 640px;
      padding: 32px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1;
      margin: 0 0 12px;
    }

    p {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 24px;
    }

    .chat-box {
      display: grid;
      gap: 16px;
    }

    textarea {
      background: #020617;
      border: 1px solid #475569;
      border-radius: 18px;
      color: #f8fafc;
      font: inherit;
      min-height: 130px;
      padding: 16px;
      resize: vertical;
      width: 100%;
    }

    textarea:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.18);
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: 0;
      border-radius: 999px;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 14px 22px;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .messages {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .message {
      border-radius: 18px;
      line-height: 1.5;
      padding: 14px 16px;
      white-space: pre-wrap;
    }

    .user-message {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(96, 165, 250, 0.32);
    }

    .ai-message {
      background: rgba(236, 72, 153, 0.18);
      border: 1px solid rgba(244, 114, 182, 0.32);
    }

    .speaker {
      display: block;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Clipboard AI</h1>
    <p>Type something, click send, and the AI will repeat it back as if it read your clipboard.</p>

    <section class="chat-box" aria-label="Clipboard AI chat">
      <textarea id="userInput" placeholder="Write your thing here..."></textarea>
      <button id="sendButton" type="button">Send</button>
    </section>

    <section id="messages" class="messages" aria-live="polite"></section>
  </main>

  <script>
    const userInput = document.querySelector('#userInput');
    const sendButton = document.querySelector('#sendButton');
    const messages = document.querySelector('#messages');

    function addMessage(speaker, text, className) {
      const message = document.createElement('article');
      message.className = `message ${className}`;
      message.innerHTML = `<span class="speaker"></span><span class="text"></span>`;
      message.querySelector('.speaker').textContent = speaker;
      message.querySelector('.text').textContent = text;
      messages.append(message);
    }

    function sendMessage() {
      const text = userInput.value.trim();

      if (!text) {
        userInput.focus();
        return;
      }

      addMessage('You said', text, 'user-message');
      addMessage('AI said', `Your clipboard says: ${text}`, 'ai-message');
      userInput.value = '';
      userInput.focus();
    }

    sendButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
        sendMessage();
      }
    });
  </script>
</body>
</html>
