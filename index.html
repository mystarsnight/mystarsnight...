<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080b13;--bg2:#111827;--panel:rgba(17,24,39,.78);--panel2:rgba(31,41,55,.72);--text:#f8fafc;--muted:#94a3b8;--line:rgba(148,163,184,.18);--accent:#55d6ff;--accent2:#a78bfa;--good:#5eead4;--warn:#fbbf24;--danger:#fb7185;--shadow:0 24px 80px rgba(0,0,0,.36);--radius:20px;--side:310px;--font:16px;--gap:14px}
    [data-theme=amoled]{--bg:#000;--bg2:#020202;--panel:rgba(7,7,7,.9);--panel2:rgba(15,15,15,.86);--text:#fff;--muted:#aaa;--line:rgba(255,255,255,.12);--accent:#00f5ff;--accent2:#fff}
    [data-theme=light]{--bg:#edf2f7;--bg2:#fff;--panel:rgba(255,255,255,.86);--panel2:rgba(248,250,252,.9);--text:#0f172a;--muted:#475569;--line:rgba(15,23,42,.12);--accent:#2563eb;--accent2:#7c3aed;--shadow:0 20px 60px rgba(15,23,42,.12)}
    [data-theme=blue]{--accent:#38bdf8;--accent2:#2563eb;--bg:#061525;--bg2:#0d2440}[data-theme=green]{--accent:#34d399;--accent2:#16a34a;--bg:#041711;--bg2:#0b2a1f}[data-theme=purple]{--accent:#c084fc;--accent2:#7c3aed;--bg:#15091f;--bg2:#27103a}[data-theme=orange]{--accent:#fb923c;--accent2:#f59e0b;--bg:#1d1006;--bg2:#39200c}[data-theme=red]{--accent:#fb7185;--accent2:#dc2626;--bg:#1f0710;--bg2:#3b1020}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;color:var(--text);font:var(--font)/1.5 Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% -10%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 33%),radial-gradient(circle at 90% 0,color-mix(in srgb,var(--accent2) 24%,transparent),transparent 30%),linear-gradient(135deg,var(--bg),var(--bg2));overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer}.orbitron,h1,h2,h3,.brand,.loading-title{font-family:Orbitron,Inter,sans-serif}.app{height:100%;display:grid;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(18px);z-index:5}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06111f;font-weight:900;box-shadow:0 12px 34px color-mix(in srgb,var(--accent) 30%,transparent)}.brand{font-weight:900;letter-spacing:.04em}.model-chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.85rem;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}.icon-btn,.primary,.ghost{min-height:42px;border-radius:14px;padding:0 14px;background:var(--panel2);border:1px solid var(--line)}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07101d;font-weight:800}.shell{min-height:0;display:grid;grid-template-columns:var(--side) 1fr}.sidebar{min-width:230px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(20px);display:flex;flex-direction:column;min-height:0}.side-head{padding:14px;display:grid;gap:10px}.searchbox{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:12px}.chat-list{overflow:auto;padding:0 10px 12px;display:grid;gap:8px}.conv{display:grid;grid-template-columns:1fr auto;gap:6px;padding:11px;border:1px solid transparent;border-radius:16px;background:transparent;text-align:left}.conv:hover,.conv.active{background:var(--panel2);border-color:var(--line)}.conv-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv-meta{font-size:.76rem;color:var(--muted)}.conv-actions{display:flex;gap:3px}.mini{padding:5px 7px;border-radius:10px;background:transparent}.main{min-width:0;display:grid;grid-template-rows:1fr auto;position:relative}.messages{overflow:auto;padding:24px max(18px,8vw);scroll-behavior:smooth}.msg{max-width:920px;margin:0 auto var(--gap);display:grid;gap:7px}.bubble{border:1px solid var(--line);border-radius:22px;padding:15px 16px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.12)}.msg.user .bubble{margin-left:auto;max-width:min(760px,86%);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--panel)),var(--panel2))}.msg.ai .bubble{margin-right:auto}.tools{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}.tool{padding:5px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}.time{margin-left:auto;color:var(--muted)}.composer{border-top:1px solid var(--line);padding:14px max(14px,7vw);background:linear-gradient(0deg,var(--bg),transparent);}.compose-card{max-width:980px;margin:auto;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);padding:10px;display:grid;gap:8px}.textarea{width:100%;min-height:54px;max-height:180px;resize:none;border:0;outline:0;background:transparent;padding:10px}.compose-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 28%),linear-gradient(135deg,var(--bg),var(--bg2));transition:opacity .65s,visibility .65s}.loading.done{opacity:0;visibility:hidden}.load-card{width:min(620px,92vw);padding:34px;border:1px solid var(--line);border-radius:30px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(20px)}.loading-title{font-size:clamp(2.3rem,8vw,4.8rem);margin:0}.bar{height:13px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}.load-grid,.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:var(--muted)}.drawer{position:fixed;right:16px;top:76px;width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 92px);overflow:auto;padding:16px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(22px);z-index:10;display:none}.drawer.open{display:block}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px}.markdown pre{position:relative;padding:16px;overflow:auto;border-radius:16px;background:#05070c;border:1px solid var(--line)}.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.copy-code{position:absolute;right:8px;top:8px}.match{background:color-mix(in srgb,var(--warn) 60%,transparent);color:#111;border-radius:4px}.typing::after{content:'▋';animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;inset:64px auto 0 0;width:min(88vw,var(--side));z-index:8;transform:translateX(-105%);transition:.25s}.sidebar.open{transform:none}.messages{padding:18px 12px}.hide-mobile{display:none}.topbar{gap:8px}.model-chip{display:none}}@media(prefers-reduced-motion:reduce){*,html{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body data-theme="dark">
  <div class="loading" id="loading"><div class="load-card"><p class="muted orbitron">Browser AI</p><h1 class="loading-title">Loading AI…</h1><div class="bar"><span id="loadBar"></span></div><div class="load-grid"><span>Progress: <b id="loadPct">0%</b></span><span>ETA: <b id="eta">calculating</b></span><span>Stage: <b id="stage">Booting</b></span><span>Model: <b id="loadModel">TinyLlama</b></span><span>Cache: <b id="cacheStatus">checking</b></span><span>Backend: <b id="backend">detecting</b></span></div><p id="loadHint" class="muted">The model is downloaded from its public host once and cached by the browser.</p></div></div>
  <div class="app"><header class="topbar"><button class="icon-btn" id="menuBtn">☰</button><div class="logo">AI</div><div><div class="brand">Browser AI</div><div class="model-chip" id="modelChip">loading model</div></div><div class="spacer"></div><button class="ghost" id="newBtn">New Chat</button><button class="ghost" id="searchBtn">Search</button><button class="ghost" id="settingsBtn">Settings</button></header>
  <div class="shell"><aside class="sidebar" id="sidebar"><div class="side-head"><button class="primary" id="newBtn2">+ New Chat</button><input class="searchbox" id="convSearch" placeholder="Search conversations…"></div><div class="chat-list" id="chatList"></div></aside><main class="main"><section class="messages" id="messages"></section><footer class="composer"><div class="compose-card"><textarea id="prompt" class="textarea" placeholder="Ask Browser AI anything…"></textarea><div class="compose-row"><button class="ghost" id="uploadBtn">Upload</button><span id="chars">0 chars</span><span class="spacer"></span><button class="ghost" id="continueBtn">Continue</button><button class="ghost" id="stopBtn">Stop</button><button class="primary" id="sendBtn">Send</button></div></div></footer></main></div></div>
  <section class="drawer" id="settings"><h2>Settings</h2><div class="settings-grid"><label class="field">Theme<select id="theme"></select></label><label class="field">Font size<input id="fontSize" type="range" min="13" max="22"></label><label class="field">Temperature<input id="temperature" type="range" min="0" max="1.5" step="0.05"></label><label class="field">Max tokens<input id="maxTokens" type="range" min="64" max="2048" step="32"></label><label class="field">Sidebar width<input id="sideWidth" type="range" min="240" max="460"></label><label class="field">Message spacing<input id="msgGap" type="range" min="8" max="28"></label></div><div id="toggles"></div><p><button class="ghost" id="exportAll">Export conversations</button> <button class="ghost" id="importAll">Import conversations</button> <button class="ghost" id="clearAll">Clear conversations</button> <button class="ghost" id="resetSet">Reset settings</button></p><input id="importFile" type="file" accept="application/json" hidden></section>
<script type="module">
import * as webllm from 'https://esm.run/@mlc-ai/web-llm';
const MODEL='TinyLlama-1.1B-Chat-v0.4-q4f16_1-MLC', themes=['dark','amoled','light','blue','green','purple','orange','red'];
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID(), now=()=>new Date().toISOString();
let engine, abort=false, current, conversations=[], searchTerm='';
let settings={theme:'dark',fontSize:16,temperature:.7,maxTokens:512,autoScroll:true,typingAnimation:true,showTimestamps:true,sound:false,reduceMotion:false,saveConversations:true,sideWidth:310,msgGap:14};
function load(){settings={...settings,...JSON.parse(localStorage.browserAISettings||'{}')};conversations=JSON.parse(localStorage.browserAIConversations||'[]');if(!conversations.length)newChat();current=conversations[0]?.id;applySettings();renderList();renderMessages()}
function save(){if(settings.saveConversations)localStorage.browserAIConversations=JSON.stringify(conversations);localStorage.browserAISettings=JSON.stringify(settings)}
function applySettings(){document.body.dataset.theme=settings.theme;document.documentElement.style.setProperty('--font',settings.fontSize+'px');document.documentElement.style.setProperty('--side',settings.sideWidth+'px');document.documentElement.style.setProperty('--gap',settings.msgGap+'px');document.body.style.scrollBehavior=settings.reduceMotion?'auto':'smooth';['theme','fontSize','temperature','maxTokens','sideWidth','msgGap'].forEach(k=>$(k)&&( $(k).value=settings[k]));}
function newChat(){const c={id:uid(),title:'New conversation',createdAt:now(),updatedAt:now(),pinned:false,favorite:false,messages:[]};conversations.unshift(c);current=c.id;save();renderList();renderMessages();return c}
function chat(){return conversations.find(c=>c.id===current)||conversations[0]}
function renderList(){let q=$('convSearch').value.toLowerCase();$('chatList').innerHTML=conversations.filter(c=>(c.title+c.messages.map(m=>m.content).join(' ')).toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||new Date(b.updatedAt)-new Date(a.updatedAt)).map(c=>`<button class="conv ${c.id===current?'active':''}" data-id="${c.id}"><span><div class="conv-title">${c.pinned?'📌 ':''}${c.favorite?'★ ':''}${esc(c.title)}</div><div class="conv-meta">${new Date(c.updatedAt).toLocaleString()}</div></span><span class="conv-actions"><span class="mini" data-act="rename">✎</span><span class="mini" data-act="fav">★</span><span class="mini" data-act="pin">📌</span><span class="mini" data-act="dup">⧉</span><span class="mini" data-act="export">⇩</span><span class="mini" data-act="del">🗑</span></span></button>`).join('')}
function renderMessages(){const c=chat();$('messages').innerHTML=(c?.messages||[]).map((m,i)=>`<article class="msg ${m.role}" data-i="${i}"><div class="bubble markdown">${md(highlight(m.content))}</div><div class="tools"><button class="tool" data-a="copy">Copy</button><button class="tool" data-a="edit">Edit</button><button class="tool" data-a="delete">Delete</button><button class="tool" data-a="retry">Retry</button>${settings.showTimestamps?`<span class="time">${new Date(m.time).toLocaleTimeString()}</span>`:''}</div></article>`).join('')||`<div class="msg ai"><div class="bubble"><h2>Welcome to Browser AI</h2><p>Private, local chat powered by a free browser model. WebGPU is used when available; unsupported browsers show a graceful fallback.</p></div></div>`;enhanceCode();if(settings.autoScroll)$('messages').scrollTop=$('messages').scrollHeight}
function md(s){return s.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><button class="tool copy-code">Copy code</button><code>${c.replace(/^\w+\n/,'')}</code></pre>`).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function highlight(s){s=esc(s);return searchTerm?s.replace(new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark class="match">$1</mark>'):s}
function enhanceCode(){document.querySelectorAll('.copy-code').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.nextElementSibling.innerText))}
async function send(text=$('prompt').value.trim()){if(!text||!engine)return;const c=chat();c.messages.push({role:'user',content:text,time:now()});c.title=c.title==='New conversation'?text.slice(0,42):c.title;c.messages.push({role:'ai',content:'',time:now()});c.updatedAt=now();$('prompt').value='';abort=false;save();renderList();renderMessages();const ai=c.messages[c.messages.length-1];try{const stream=await engine.chat.completions.create({messages:c.messages.slice(0,-1).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content})),temperature:+settings.temperature,max_tokens:+settings.maxTokens,stream:true});for await(const chunk of stream){if(abort)break;ai.content+=chunk.choices?.[0]?.delta?.content||'';renderMessages()}if(abort)ai.content+='\n\n_[stopped]_'}catch(e){ai.content='WebGPU/model error: '+e.message+'\n\nTry Chrome or Edge with WebGPU enabled.'}c.updatedAt=now();save();renderList();renderMessages()}
async function boot(){const start=Date.now(), set=(p,stage)=>{$('loadPct').textContent=Math.round(p*100)+'%';$('loadBar').style.width=p*100+'%';$('stage').textContent=stage;$('eta').textContent=p?Math.max(1,Math.round((Date.now()-start)*(1-p)/p/1000))+'s':'calculating'};$('backend').textContent=navigator.gpu?'WebGPU available':'WebGPU unsupported';$('loadModel').textContent=MODEL;if(!navigator.gpu){$('stage').textContent='Unsupported';$('loadHint').textContent='This browser cannot run the local model because WebGPU is unavailable.';return}try{if('caches'in window){const keys=await caches.keys();$('cacheStatus').textContent=keys.length?'cached assets found':'first download'}engine=await webllm.CreateMLCEngine(MODEL,{initProgressCallback:r=>set(r.progress||0,r.text||'Loading model')});set(1,'Ready');$('modelChip').textContent=MODEL;setTimeout(()=>$('loading').classList.add('done'),450)}catch(e){$('stage').textContent='Load failed';$('loadHint').textContent=e.message}}
$('sendBtn').onclick=()=>send();$('stopBtn').onclick=()=>abort=true;$('continueBtn').onclick=()=>send('Continue from your previous response.');$('prompt').oninput=e=>{$('chars').textContent=e.target.value.length+' chars';e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();searchTerm=prompt('Search messages')||'';renderMessages()}if(e.ctrlKey&&e.key===',')$('settings').classList.toggle('open')};$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');$('searchBtn').onclick=()=>{$('convSearch').focus();$('sidebar').classList.add('open')};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('newBtn').onclick=$('newBtn2').onclick=newChat;$('convSearch').oninput=renderList;$('chatList').onclick=e=>{const row=e.target.closest('.conv');if(!row)return;const c=conversations.find(x=>x.id===row.dataset.id), a=e.target.dataset.act;if(a==='del'){conversations=conversations.filter(x=>x.id!==c.id);current=conversations[0]?.id; if(!current)newChat()}else if(a==='fav')c.favorite=!c.favorite;else if(a==='pin')c.pinned=!c.pinned;else if(a==='rename'){const v=prompt('Rename conversation',c.title);if(v)c.title=v}else if(a==='dup'){conversations.unshift({...JSON.parse(JSON.stringify(c)),id:uid(),title:c.title+' copy',createdAt:now(),updatedAt:now()})}else if(a==='export'){download((c.title||'chat')+'.json',JSON.stringify(c,null,2))}else current=c.id;save();renderList();renderMessages()};$('messages').onclick=e=>{const art=e.target.closest('.msg'), c=chat(); if(!art||!e.target.dataset.a)return;const i=+art.dataset.i,m=c.messages[i],a=e.target.dataset.a;if(a==='copy')navigator.clipboard.writeText(m.content);if(a==='delete')c.messages.splice(i,1);if(a==='edit'){const v=prompt('Edit message',m.content);if(v!==null)m.content=v}if(a==='retry'){c.messages.splice(i);send(c.messages.pop()?.content||'Please try again.');return}save();renderMessages()};themes.forEach(t=>$('theme').insertAdjacentHTML('beforeend',`<option>${t}</option>`));['autoScroll','typingAnimation','showTimestamps','sound','reduceMotion','saveConversations'].forEach(k=>$('toggles').insertAdjacentHTML('beforeend',`<label class="field"><input type="checkbox" id="${k}"> ${k.replace(/[A-Z]/g,' $&')}</label>`));Object.keys(settings).forEach(k=>{if($(k)){if($(k).type==='checkbox')$(k).checked=settings[k];$(k).oninput=e=>{settings[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;applySettings();save();renderMessages()}}});$('exportAll').onclick=()=>download('browser-ai-conversations.json',JSON.stringify(conversations,null,2));$('clearAll').onclick=()=>{if(confirm('Clear all conversations?')){conversations=[];newChat()}};$('resetSet').onclick=()=>{localStorage.removeItem('browserAISettings');location.reload()};$('importAll').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const data=JSON.parse(await e.target.files[0].text());conversations=Array.isArray(data)?data:[data,...conversations];current=conversations[0]?.id;save();renderList();renderMessages()};function download(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()}load();boot();
</script>
</body>
</html>
